<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stepper enhanced</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            overflow: hidden;
            user-select: none;
        }

        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .title {
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 2px;
            color: #666;
        }

        .transport {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:hover {
            background: #252525;
            border-color: #444;
        }

        .btn.active {
            background: #4a9eff;
            border-color: #4a9eff;
            color: #000;
            transform: scale(0.97);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn.secondary {
            background: transparent;
            border-color: #333;
        }

        .btn.warning {
            border-color: #ff6b4a;
            color: #ff6b4a;
        }

        .btn.warning:hover {
            background: #ff6b4a;
            color: #000;
        }

        /* Tempo Knob */
        .tempo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .tempo-label {
            font-size: 11px;
            color: #666;
            font-weight: 600;
        }

        .tempo-knob-container {
            position: relative;
            width: 60px;
            height: 60px;
        }

        .tempo-knob {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #2a2a2a, #1a1a1a);
            border: 2px solid #333;
            position: relative;
            cursor: grab;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .tempo-knob:active {
            cursor: grabbing;
        }

        .tempo-knob::after {
            content: '';
            position: absolute;
            width: 4px;
            height: 20px;
            background: #4a9eff;
            border-radius: 2px;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 8px #4a9eff;
        }

        .tempo-value {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            font-weight: 600;
            color: #4a9eff;
            white-space: nowrap;
        }

        .bar-indicator {
            font-size: 11px;
            color: #4a9eff;
            font-weight: 600;
            padding: 12px 16px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
        }

        /* Pattern Sequencer */
        .pattern-sequencer-panel {
            background: #151515;
            border: 1px solid #252525;
            border-radius: 6px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .pattern-sequencer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #252525;
        }

        .pattern-sequencer-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #666;
        }

        .pattern-sequencer-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .pattern-mode-select {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
        }

        #pattern-seq-toggle.active {
            background: #ffffff;
            border-color: #ffffff;
            color: #000;
        }

        .pattern-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 10px;
        }

        .pattern-cell {
            background: #1a1a1a;
            border: 1px solid #252525;
            border-radius: 4px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .pattern-cell:hover {
            border-color: #444;
        }

        .pattern-cell.active {
            border-color: #4a9eff;
            box-shadow: 0 0 10px rgba(74, 158, 255, 0.3);
        }

        .pattern-cell.selected {
            border-color: #ffd700;
            background: #2a2510;
        }

        .pattern-cell.has-data {
            background: #1f1f1f;
            border-color: #333;
        }

        .pattern-cell.selected.has-data {
            background: #2a2510;
            border-color: #ffd700;
        }

        .pattern-cell-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pattern-number {
            font-size: 10px;
            font-weight: 700;
            color: #666;
            letter-spacing: 1px;
        }

        .pattern-header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pattern-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #333;
        }

        .pattern-cell.has-data .pattern-indicator {
            background: #4a9eff;
        }

        .pattern-loop-btn {
            width: 20px;
            height: 20px;
            background: #252525;
            border: 1px solid #333;
            border-radius: 3px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            font-weight: 700;
            color: #666;
            transition: all 0.2s;
        }

        .pattern-loop-btn:hover {
            border-color: #4a9eff;
            color: #4a9eff;
        }

        .pattern-loop-btn.active {
            background: #4a9eff;
            border-color: #4a9eff;
            color: #000;
        }

        .pattern-buttons {
            display: flex;
            gap: 4px;
        }

        .pattern-mini-btn {
            flex: 1;
            background: #252525;
            border: 1px solid #333;
            color: #999;
            padding: 6px 4px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .pattern-mini-btn:hover {
            border-color: #4a9eff;
            color: #4a9eff;
        }

        .pattern-mini-btn.copy-active {
            background: #4a9eff;
            border-color: #4a9eff;
            color: #000;
        }

        .pattern-buttons-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }

        .pattern-select-row {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .pattern-select-label {
            font-size: 8px;
            color: #666;
            font-weight: 600;
            min-width: 35px;
        }

        .pattern-dropdown {
            flex: 1;
            background: #252525;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 4px;
            border-radius: 3px;
            font-size: 9px;
            cursor: pointer;
        }

        .pattern-slider-row {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .pattern-mini-slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 2px;
            background: #252525;
            outline: none;
            border-radius: 2px;
            cursor: pointer;
        }

        .pattern-mini-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            background: #4a9eff;
            cursor: grab;
            border-radius: 50%;
        }

        .pattern-mini-slider::-moz-range-thumb {
            width: 10px;
            height: 10px;
            background: #4a9eff;
            cursor: grab;
            border-radius: 50%;
            border: none;
        }

        .pattern-value-display {
            font-size: 9px;
            color: #4a9eff;
            min-width: 30px;
            text-align: right;
            font-weight: 600;
        }

        .main-content {
            display: flex;
            gap: 20px;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .tracks-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            padding-right: 10px;
        }

        /* Mobile styles */
        @media (max-width: 768px) {
            .pattern-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .track {
            background: #151515;
            border: 1px solid #252525;
            border-radius: 6px;
            padding: 15px;
            display: flex;
            gap: 15px;
            align-items: stretch;
            transition: all 0.2s;
        }

        .track:hover {
            border-color: #333;
        }

        .track.selected {
            border-color: #4a9eff;
        }

        .track.muted {
            opacity: 0.5;
        }

        .track-header {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 100px;
        }

        .track-name {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .track-controls {
            display: flex;
            gap: 8px;
        }

        .track-btn {
            width: 32px;
            height: 32px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 3px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            transition: all 0.2s;
        }

        .track-btn:hover {
            border-color: #4a9eff;
        }

        .track-btn.active {
            background: #4a9eff;
            border-color: #4a9eff;
            color: #000;
        }

        .sequencer {
            display: flex;
            gap: 4px;
            flex: 1;
        }

        .step-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .lock-buttons {
            display: flex;
            gap: 3px;
        }

        .lock-btn {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #252525;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.1s;
            font-size: 9px;
            font-weight: 600;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px;
            width: 20px;
            height: 20px;
        }

        .lock-btn:hover {
            border-color: #4a9eff;
            color: #4a9eff;
        }

        .lock-btn.active {
            background: #4a9eff;
            border-color: #4a9eff;
            color: #000;
        }

        .lock-btn.slide-active {
            background: #ff6b4a;
            border-color: #ff6b4a;
            color: #000;
        }

        .step {
            flex: 1;
            min-height: 50px;
            background: #1a1a1a;
            border: 1px solid #252525;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.1s;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            overflow: hidden;
        }

        .step:hover {
            border-color: #4a9eff;
        }

        .step.active {
            background: #4a4a4a;
            border-color: #666;
        }

        .step.playing {
            box-shadow: 0 0 15px #4a9eff;
        }

        .step.beat-4 {
            border-left: 2px solid #333;
        }

        .step.has-locks {
            background: #6b5a00;
            border-color: #ffd700;
        }

        .step.has-locks.active {
            background: #8b7500;
        }

        .velocity-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, #4a9eff, rgba(74, 158, 255, 0.3));
            pointer-events: none;
            transition: height 0.1s;
        }

        .velocity-value {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 9px;
            font-weight: 600;
            color: #4a9eff;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }

        .step:hover .velocity-value {
            opacity: 1;
        }

        .step-condition {
            width: 100%;
            background: #0d0d0d;
            border: 1px solid #252525;
            border-radius: 2px;
            color: #888;
            font-size: 9px;
            padding: 3px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
        }

        .step-condition:hover {
            border-color: #4a9eff;
            color: #4a9eff;
        }

        .side-panel {
            width: 450px;
            background: #151515;
            border: 1px solid #252525;
            border-radius: 6px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .side-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #252525;
        }

        .side-panel-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #4a9eff;
        }

        .close-panel-btn {
            display: none;
            padding: 8px 16px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 3px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 600;
            color: #e0e0e0;
            transition: all 0.2s;
        }

        .close-panel-btn:hover {
            border-color: #4a9eff;
            color: #4a9eff;
        }

        #trigger-btn {
            display: block;
        }

        @media (max-width: 768px) {
            .close-panel-btn {
                display: block;
            }

            #trigger-btn {
                display: block;
            }
        }

        .section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .section-title {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #666;
            border-bottom: 1px solid #252525;
            padding-bottom: 8px;
        }

        .param-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .param {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .param-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #999;
        }

        .param-value {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 3px;
            background: #252525;
            outline: none;
            border-radius: 2px;
            cursor: pointer;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            background: #4a9eff;
            cursor: grab;
            border-radius: 50%;
        }

        .slider:active::-webkit-slider-thumb {
            cursor: grabbing;
        }

        .slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: #4a9eff;
            cursor: grab;
            border-radius: 50%;
            border: none;
        }

        .value-display {
            font-size: 11px;
            font-weight: 600;
            color: #4a9eff;
            min-width: 50px;
            text-align: right;
        }

        .engine-select {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .engine-btn {
            padding: 8px 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 3px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .engine-btn:hover {
            border-color: #4a9eff;
        }

        .engine-btn.active {
            background: #4a9eff;
            border-color: #4a9eff;
            color: #000;
        }

        .morph-control {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .morph-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .morph-title {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #999;
        }

        .morph-buttons {
            display: flex;
            gap: 8px;
        }

        .morph-btn {
            padding: 6px 12px;
            background: transparent;
            border: 1px solid #333;
            border-radius: 3px;
            cursor: pointer;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #e0e0e0;
            transition: all 0.2s;
        }

        .morph-btn:hover {
            border-color: #4a9eff;
            color: #4a9eff;
        }

        .fx-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #444;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #151515;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 30px;
            max-width: 350px;
        }

        .modal-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 20px;
        }

        .condition-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .condition-option {
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 3px;
            cursor: pointer;
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .condition-option:hover {
            border-color: #4a9eff;
            color: #4a9eff;
        }

        .modal-input {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 12px;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .global-controls {
            background: #151515;
            border: 1px solid #252525;
            border-radius: 6px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="title">stepper</div>
            <div class="transport">
                <div class="bar-indicator" id="bar-indicator">Bar: 1/4</div>
                <div class="tempo">
                    <span class="tempo-label">TEMPO</span>
                    <div class="tempo-knob-container">
                        <div class="tempo-knob" id="tempo-knob"></div>
                        <div class="tempo-value" id="tempo-value">128</div>
                    </div>
                </div>
                <button class="btn" id="play-btn">PLAY</button>
                <button class="btn secondary" id="reset-btn">RESET</button>
            </div>
        </div>

        <div class="pattern-sequencer-panel">
            <div class="pattern-sequencer-header">
                <div class="pattern-sequencer-title">PATTERN SEQUENCER</div>
                <div class="pattern-sequencer-controls">
                    <select class="pattern-mode-select" id="pattern-mode">
                        <option value="forward">FORWARD</option>
                        <option value="pingpong">FORWARD & BACK</option>
                        <option value="random">RANDOM</option>
                        <option value="instant">INSTANT</option>
                        <option value="next">NEXT</option>
                    </select>
                    <button class="btn secondary" id="pattern-seq-toggle">ENABLE</button>
                </div>
            </div>
            <div class="pattern-grid" id="pattern-grid"></div>
        </div>

        <div class="main-content">
            <div class="tracks-panel" id="tracks-panel"></div>

            <div class="side-panel" id="side-panel">
                <div class="side-panel-header">
                    <div class="side-panel-title" id="synth-title">SYNTHESIS</div>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <button class="btn secondary" id="trigger-btn" style="padding: 8px 16px; font-size: 10px;">TRIGGER</button>
                        <button class="close-panel-btn" id="close-panel-btn">CLOSE</button>
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">ENGINE</div>
                    <div class="engine-select" id="engine-select"></div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                        <button class="btn secondary" id="set-normal-btn">SET NORMAL</button>
                        <button class="btn secondary" id="recall-normal-btn">RECALL NORMAL</button>
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">SOUND MORPH</div>
                    <div class="morph-control">
                        <div class="morph-header">

    <script>

                    strike: { label: 'Strike', min: 0, max: 0.05, step: 0.001, default: 0.002 },
                    damping: { label: 'Damping', min: 0, max: 2, step: 0.01, default: 0.8 },

                }
            },
            'Physical': {

                params: {

                    material: { label: 'Material', min: 0.3, max: 2, step: 0.01, default: 1 },
                    tension: { label: 'Tension', min: 0, max: 2, step: 0.01, default: 1 },
                    strike: { label: 'Strike Hard', min: 0, max: 0.08, step: 0.001, default: 0.003 },
                    position: { label: 'Strike Pos', min: 0, max: 0.9, step: 0.01, default: 0.35 },
                    resonance: { label: 'Body Res', min: 0, max: 15, step: 0.1, default: 5 },

                }

        };

        const FX_SPECS = {
            waspFilter: { label: 'Wasp Mix', min: 0, max: 1, step: 0.01, default: 0 },
            waspFreq: { label: 'Wasp Freq', min: 100, max: 8000, step: 10, default: 2000 },
            waspRes: { label: 'Wasp Res', min: 0.5, max: 30, step: 0.5, default: 5 },
            waspDrive: { label: 'Wasp Drive', min: 1, max: 10, step: 0.1, default: 2 },
            drive: { label: 'Drive', min: 1, max: 20, step: 0.1, default: 1 },
            distortion: { label: 'Distortion', min: 0, max: 1, step: 0.01, default: 0 },
            resonator: { label: 'Resonator', min: 0, max: 1, step: 0.01, default: 0 },
            resFreq: { label: 'Res Freq', min: 100, max: 2000, step: 10, default: 440 },
            resDecay: { label: 'Res Decay', min: 0.05, max: 2, step: 0.05, default: 0.3 },
            delay: { label: 'Delay', min: 0, max: 1, step: 0.01, default: 0 },
            delayTime: { label: 'Delay Time', min: 0.05, max: 1, step: 0.01, default: 0.25 },
            reverb: { label: 'Reverb', min: 0, max: 1, step: 0.01, default: 0 },
            reverbSize: { label: 'Reverb Size', min: 0.5, max: 4, step: 0.1, default: 2 },
            glitch: { label: 'Glitch', min: 0, max: 1, step: 0.01, default: 0 },
            glitchRate: { label: 'Glitch Rate', min: 0.02, max: 0.5, step: 0.01, default: 0.1 }
        };

        // Audio Engine with FX (same as original)
        class DrumSynthEngine {
            constructor() {
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                this.masterGain = this.audioContext.createGain();
                this.masterGain.gain.value = 0.5;
                
                // Master FX chain
                this.masterFXInput = this.audioContext.createGain();
                this.masterFXOutput = this.masterGain;
                this.masterFXNodes = [];
                
                // Initially connect input directly to output (no FX)
                this.masterFXInput.connect(this.masterFXOutput);
                this.masterGain.connect(this.audioContext.destination);
                
                this.activeVoices = new Map();
                this.scheduledCleanups = new Set();
            }

            stopVoice(trackId) {
                if (this.activeVoices.has(trackId)) {
                    const voice = this.activeVoices.get(trackId);
                    const now = this.audioContext.currentTime;
                    
                    if (voice.outputGain && voice.outputGain.gain) {
                        voice.outputGain.gain.cancelScheduledValues(now);
                        voice.outputGain.gain.setValueAtTime(voice.outputGain.gain.value, now);
                        voice.outputGain.gain.linearRampToValueAtTime(0, now + 0.02);
                    }
                    
                    setTimeout(() => {
                        if (voice.oscillators) {
                            voice.oscillators.forEach(osc => {
                                try {
                                    osc.stop();
                                } catch(e) {}
                            });
                        }
                        if (voice.sources) {
                            voice.sources.forEach(src => {
                                try {
                                    src.stop();
                                } catch(e) {}
                            });
                        }
                    }, 25);
                    
                    this.activeVoices.delete(trackId);
                }
            }

            updateMasterFX(fx) {
                // Disconnect old chain
                this.masterFXInput.disconnect();
                this.masterFXNodes.forEach(node => {
                    try {
                        node.disconnect();
                    } catch(e) {}
                });
                this.masterFXNodes = [];
                
                // Build new FX chain
                const dummyVoice = {
                    output: this.masterFXInput
                };
                
                const fxResult = this.applyFX(dummyVoice, fx);
                this.masterFXNodes = fxResult.fxNodes || [];
                
                // Connect final output to master gain
                fxResult.output.connect(this.masterGain);
            }

            scheduleCleanup(nodes, stopTime) {
                const cleanupTime = Math.max(0, (stopTime - this.audioContext.currentTime) * 1000 + 100);
                const timeoutId = setTimeout(() => {
                    nodes.forEach(node => {
                        try {
                            if (node.stop) node.stop();
                            node.disconnect();
                        } catch(e) {}
                    });
                    this.scheduledCleanups.delete(timeoutId);
                }, cleanupTime);
                this.scheduledCleanups.add(timeoutId);
            }

            createReverbImpulse(size = 2) {
                const sampleRate = this.audioContext.sampleRate;
                const length = sampleRate * size;
                const impulse = this.audioContext.createBuffer(2, length, sampleRate);
                
                for (let channel = 0; channel < 2; channel++) {
                    const channelData = impulse.getChannelData(channel);
                    for (let i = 0; i < length; i++) {
                        channelData[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2);
                    }
                }
                
                return impulse;
            }

            applyFX(voiceInfo, fx) {
                let current = voiceInfo.output;
                const now = this.audioContext.currentTime;
                const fxNodes = [];
                
                if (fx.waspFilter > 0) {
                    const preDrive = this.audioContext.createWaveShaper();
                    const driveCurve = new Float32Array(256);
                    for (let i = 0; i < 256; i++) {
                        const x = (i - 128) / 128;
                        driveCurve[i] = Math.tanh(x * (fx.waspDrive || 2)) * 0.9;
                    }
                    preDrive.curve = driveCurve;
                    
                    const filter1 = this.audioContext.createBiquadFilter();
                    const filter2 = this.audioContext.createBiquadFilter();
                    const filter3 = this.audioContext.createBiquadFilter();
                    const filter4 = this.audioContext.createBiquadFilter();
                    
                    [filter1, filter2, filter3, filter4].forEach(f => {
                        f.type = 'lowpass';
                        f.frequency.value = fx.waspFreq || 2000;
                        f.Q.value = (fx.waspRes || 5) / 4;
                    });
                    
                    const waspWet = this.audioContext.createGain();
                    const waspDry = this.audioContext.createGain();
                    const waspMerger = this.audioContext.createGain();
                    
                    waspWet.gain.value = fx.waspFilter;
                    waspDry.gain.value = 1 - fx.waspFilter * 0.7;
                    
                    current.connect(preDrive);
                    preDrive.connect(filter1);
                    filter1.connect(filter2);
                    filter2.connect(filter3);
                    filter3.connect(filter4);
                    filter4.connect(waspWet);
                    waspWet.connect(waspMerger);
                    
                    current.connect(waspDry);
                    waspDry.connect(waspMerger);
                    
                    fxNodes.push(preDrive, filter1, filter2, filter3, filter4, waspWet, waspDry, waspMerger);
                    current = waspMerger;
                }
                
                if (fx.drive > 1) {
                    const driveNode = this.audioContext.createWaveShaper();
                    const curve = new Float32Array(256);
                    for (let i = 0; i < 256; i++) {
                        const x = (i - 128) / 128;
                        curve[i] = Math.tanh(x * fx.drive) / Math.tanh(fx.drive);
                    }
                    driveNode.curve = curve;
                    
                    current.connect(driveNode);
                    fxNodes.push(driveNode);
                    current = driveNode;
                }
                
                if (fx.distortion > 0) {
                    const distNode = this.audioContext.createWaveShaper();
                    const amount = fx.distortion * 50;
                    const curve = new Float32Array(256);
                    for (let i = 0; i < 256; i++) {
                        const x = (i - 128) / 128;
                        curve[i] = (Math.exp(amount * x) - Math.exp(-amount * x)) / 
                                   (Math.exp(amount * x) + Math.exp(-amount * x));
                    }
                    distNode.curve = curve;
                    
                    const distGain = this.audioContext.createGain();
                    distGain.gain.value = 1 / (1 + fx.distortion);
                    
                    current.connect(distNode);
                    distNode.connect(distGain);
                    fxNodes.push(distNode, distGain);
                    current = distGain;
                }
                
                if (fx.resonator > 0) {
                    const resDelay = this.audioContext.createDelay(1);
                    const resFilter = this.audioContext.createBiquadFilter();
                    const resFeedback = this.audioContext.createGain();
                    const resWet = this.audioContext.createGain();
                    const resDry = this.audioContext.createGain();
                    const resMerger = this.audioContext.createGain();
                    
                    const delayTime = 1 / (fx.resFreq || 440);
                    resDelay.delayTime.value = delayTime;
                    
                    resFilter.type = 'bandpass';
                    resFilter.frequency.value = fx.resFreq || 440;
                    resFilter.Q.value = 20;
                    
                    resFeedback.gain.value = 0.85 * fx.resonator;
                    
                    const resDecay = fx.resDecay || 0.3;
                    resFeedback.gain.setValueAtTime(0.85 * fx.resonator, now);
                    resFeedback.gain.exponentialRampToValueAtTime(0.01, now + resDecay);
                    
                    resWet.gain.value = fx.resonator * 0.7;
                    resDry.gain.value = 1 - fx.resonator * 0.3;
                    
                    current.connect(resDelay);
                    resDelay.connect(resFilter);
                    resFilter.connect(resFeedback);
                    resFeedback.connect(resDelay);
                    resFilter.connect(resWet);
                    resWet.connect(resMerger);
                    
                    current.connect(resDry);
                    resDry.connect(resMerger);
                    
                    fxNodes.push(resDelay, resFilter, resFeedback, resWet, resDry, resMerger);
                    current = resMerger;
                }
                
                if (fx.delay > 0) {
                    const delayNode = this.audioContext.createDelay(2);
                    delayNode.delayTime.value = fx.delayTime || 0.25;
                    
                    const feedback = this.audioContext.createGain();
                    feedback.gain.value = 0.4 * fx.delay;
                    
                    const delayGain = this.audioContext.createGain();
                    delayGain.gain.value = fx.delay * 0.5;
                    
                    const merger = this.audioContext.createGain();
                    
                    current.connect(delayNode);
                    delayNode.connect(feedback);
                    feedback.connect(delayNode);
                    delayNode.connect(delayGain);
                    delayGain.connect(merger);
                    
                    current.connect(merger);
                    fxNodes.push(delayNode, feedback, delayGain, merger);
                    current = merger;
                }
                
                if (fx.reverb > 0) {
                    const reverbNode = this.audioContext.createConvolver();
                    reverbNode.buffer = this.createReverbImpulse(fx.reverbSize || 2);
                    
                    const reverbGain = this.audioContext.createGain();
                    reverbGain.gain.value = fx.reverb * 0.4;
                    
                    const dryGain = this.audioContext.createGain();
                    dryGain.gain.value = 1;
                    
                    const merger = this.audioContext.createGain();
                    
                    current.connect(reverbNode);
                    reverbNode.connect(reverbGain);
                    reverbGain.connect(merger);
                    
                    current.connect(dryGain);
                    dryGain.connect(merger);
                    
                    fxNodes.push(reverbNode, reverbGain, dryGain, merger);
                    current = merger;
                }
                
                if (fx.glitch > 0 && Math.random() < fx.glitch) {
                    const glitchGain = this.audioContext.createGain();
                    const stutterTime = fx.glitchRate || 0.1;
                    const repeats = Math.floor(1 + Math.random() * 3);
                    
                    glitchGain.gain.setValueAtTime(1, now);
                    
                    for (let i = 0; i < repeats; i++) {
                        const onTime = now + (stutterTime * i * 2);
                        const offTime = onTime + stutterTime * 0.5;
                        
                        glitchGain.gain.setValueAtTime(0, offTime);
                        glitchGain.gain.setValueAtTime(1, offTime + stutterTime * 0.5);
                    }
                    
                    current.connect(glitchGain);
                    fxNodes.push(glitchGain);
                    current = glitchGain;
                }
                
                return { output: current, fxNodes };
            }

            create808Kick(params) {
                const now = this.audioContext.currentTime;
                const { pitch = 1, pitchDecay = 0.05, decay = 0.5, punch = 1, drive = 1, 
                        sub = 0.3, click = 0, attack = 0.001 } = params;
                
                const osc = this.audioContext.createOscillator();
                const subOsc = this.audioContext.createOscillator();
                const gain = this.audioContext.createGain();
                const subGain = this.audioContext.createGain();
                const merger = this.audioContext.createGain();
                
                const oscillators = [osc, subOsc];
                const nodes = [gain, subGain, merger];
                
                const startFreq = 150 * pitch;
                const endFreq = 40 * pitch;
                osc.frequency.setValueAtTime(startFreq, now);
                osc.frequency.exponentialRampToValueAtTime(Math.max(30, endFreq), now + pitchDecay * punch);
                
                subOsc.frequency.setValueAtTime(startFreq * 0.5, now);
                subOsc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq * 0.5), now + pitchDecay * punch);
                
                if (click > 0) {
                    const clickOsc = this.audioContext.createOscillator();
                    const clickGain = this.audioContext.createGain();
                    clickOsc.type = 'square';
                    clickOsc.frequency.value = startFreq * 8;
                    clickGain.gain.setValueAtTime(click, now);
                    clickGain.gain.exponentialRampToValueAtTime(0.01, now + 0.01);
                    clickOsc.connect(clickGain);
                    clickGain.connect(merger);
                    clickOsc.start(now);
                    clickOsc.stop(now + 0.02);
                    oscillators.push(clickOsc);
                    nodes.push(clickGain);
                }
                
                const driveNode = this.audioContext.createWaveShaper();
                const curve = new Float32Array(256);
                for (let i = 0; i < 256; i++) {
                    const x = (i - 128) / 128;
                    curve[i] = Math.tanh(x * drive) * 0.8;
                }
                driveNode.curve = curve;
                nodes.push(driveNode);
                
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(1, now + attack);
                gain.gain.exponentialRampToValueAtTime(0.01, now + decay);
                
                subGain.gain.setValueAtTime(0, now);
                subGain.gain.linearRampToValueAtTime(sub, now + attack);
                subGain.gain.exponentialRampToValueAtTime(0.01, now + decay);
                
                osc.connect(driveNode);
                driveNode.connect(gain);
                subOsc.connect(subGain);
                gain.connect(merger);
                subGain.connect(merger);
                
                osc.start(now);
                subOsc.start(now);
                const stopTime = now + decay + 0.1;
                osc.stop(stopTime);
                subOsc.stop(stopTime);
                
                return { output: merger, oscillators, nodes, stopTime };
            }

            createFMDrum(params) {
                const now = this.audioContext.currentTime;
                const { pitch = 200, fmRatio = 1.6, fmAmount = 180, fmDecay = 0.15, decay = 0.15, 
                        tone = 0.8, filterQ = 1, attack = 0.001 } = params;
                
                const carrier = this.audioContext.createOscillator();
                const modulator = this.audioContext.createOscillator();
                const modGain = this.audioContext.createGain();
                const gain = this.audioContext.createGain();
                const output = this.audioContext.createGain();
                
                const oscillators = [carrier, modulator];
                const nodes = [modGain, gain, output];
                
                carrier.frequency.value = pitch;
                modulator.frequency.value = pitch * fmRatio;
                
                modGain.gain.setValueAtTime(fmAmount, now);
                if (fmAmount > 0) {
                    modGain.gain.exponentialRampToValueAtTime(Math.max(0.1, fmAmount * 0.1), now + fmDecay);
                }
                
                if (tone > 0) {
                    const filter = this.audioContext.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.value = Math.min(20000, 8000 * tone);
                    filter.Q.value = filterQ;
                    carrier.connect(filter);
                    filter.connect(gain);
                    nodes.push(filter);
                } else {
                    carrier.connect(gain);
                }
                
                modulator.connect(modGain);
                modGain.connect(carrier.frequency);
                gain.connect(output);
                
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.8, now + attack);
                gain.gain.exponentialRampToValueAtTime(0.01, now + decay);
                
                carrier.start(now);
                modulator.start(now);
                const stopTime = now + Math.max(decay, fmDecay) + 0.1;
                carrier.stop(stopTime);
                modulator.stop(stopTime);
                
                return { output, oscillators, nodes, stopTime };
            }

            createSnareDrum(params) {
                const now = this.audioContext.currentTime;
                const { pitch = 200, fmRatio = 1.6, fmAmount = 180, toneDecay = 0.08, 
                        noiseAmount = 0.65, noiseDecay = 0.12, snap = 1.5, tone = 1.2 } = params;
                
                const merger = this.audioContext.createGain();
                const oscillators = [];
                const sources = [];
                const nodes = [merger];
                
                const carrier = this.audioContext.createOscillator();
                const modulator = this.audioContext.createOscillator();
                const modGain = this.audioContext.createGain();
                const toneGain = this.audioContext.createGain();
                
                oscillators.push(carrier, modulator);
                nodes.push(modGain, toneGain);
                
                carrier.frequency.value = pitch;
                modulator.frequency.value = pitch * fmRatio;
                modGain.gain.setValueAtTime(fmAmount, now);
                if (fmAmount > 0) {
                    modGain.gain.exponentialRampToValueAtTime(1, now + toneDecay);
                }
                
                modulator.connect(modGain);
                modGain.connect(carrier.frequency);
                carrier.connect(toneGain);
                
                toneGain.gain.setValueAtTime(0, now);
                toneGain.gain.linearRampToValueAtTime(0.6 * (1 - noiseAmount), now + 0.001);
                toneGain.gain.exponentialRampToValueAtTime(0.01, now + toneDecay);
                
                let maxStopTime = toneDecay;
                
                if (noiseAmount > 0) {
                    const bufferSize = this.audioContext.sampleRate * 2;
                    const buffer = this.audioContext.createBuffer(1, bufferSize, this.audioContext.sampleRate);
                    const output = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        output[i] = Math.random() * 2 - 1;
                    }
                    
                    const noise = this.audioContext.createBufferSource();
                    noise.buffer = buffer;
                    sources.push(noise);
                    
                    const noiseFilter = this.audioContext.createBiquadFilter();
                    noiseFilter.type = 'highpass';
                    noiseFilter.frequency.value = Math.min(20000, Math.max(100, 3000 * tone));
                    noiseFilter.Q.value = snap * 3;
                    
                    const noiseGain = this.audioContext.createGain();
                    
                    nodes.push(noiseFilter, noiseGain);
                    
                    noise.connect(noiseFilter);
                    noiseFilter.connect(noiseGain);
                    
                    noiseGain.gain.setValueAtTime(0, now);
                    noiseGain.gain.linearRampToValueAtTime(0.7 * noiseAmount, now + 0.001);
                    noiseGain.gain.exponentialRampToValueAtTime(0.01, now + noiseDecay);
                    
                    noiseGain.connect(merger);
                    noise.start(now);
                    noise.stop(now + noiseDecay + 0.1);
                    maxStopTime = Math.max(maxStopTime, noiseDecay);
                }
                
                toneGain.connect(merger);
                
                carrier.start(now);
                modulator.start(now);
                const stopTime = now + maxStopTime + 0.1;
                carrier.stop(stopTime);
                modulator.stop(stopTime);
                
                return { output: merger, oscillators, sources, nodes, stopTime };
            }

            createNoiseDrum(params) {
                const now = this.audioContext.currentTime;
                const { decay = 0.04, tone = 1.8, spread = 12, attack = 0.001, 
                        shape = 1, density = 1, filterType = 1 } = params;
                
                const bufferSize = this.audioContext.sampleRate * 2;
                const buffer = this.audioContext.createBuffer(1, bufferSize, this.audioContext.sampleRate);
                const output = buffer.getChannelData(0);
                
                for (let i = 0; i < bufferSize; i++) {
                    if (density === 0 || Math.random() < density) {
                        output[i] = Math.random() * 2 - 1;
                    } else {
                        output[i] = 0;
                    }
                }
                
                const noise = this.audioContext.createBufferSource();
                noise.buffer = buffer;
                
                const sources = [noise];
                const gain = this.audioContext.createGain();
                const outputGain = this.audioContext.createGain();
                const nodes = [gain, outputGain];
                
                if (tone > 0 || spread > 0) {
                    const filter = this.audioContext.createBiquadFilter();
                    const filterTypes = ['lowpass', 'highpass', 'bandpass'];
                    filter.type = filterTypes[Math.round(filterType)];
                    filter.frequency.value = Math.min(20000, Math.max(100, 4000 * tone));
                    filter.Q.value = spread;
                    
                    nodes.push(filter);
                    noise.connect(filter);
                    filter.connect(gain);
                } else {
                    noise.connect(gain);
                }
                
                gain.connect(outputGain);
                
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.6, now + attack);
                
                if (shape > 1) {
                    gain.gain.exponentialRampToValueAtTime(0.01, now + decay);
                } else {
                    gain.gain.linearRampToValueAtTime(0, now + decay * Math.max(0.1, shape));
                }
                
                noise.start(now);
                const stopTime = now + decay + 0.1;
                noise.stop(stopTime);
                
                return { output: outputGain, sources, nodes, stopTime };
            }

            createModalDrum(params) {
                const now = this.audioContext.currentTime;
                const { pitch = 150, decay = 0.6, tone = 1.0, resonance = 8, 
                        stiffness = 1, strike = 0.002, damping = 0.8, spread = 1.03 } = params;
                
                const ratios = [];
                for (let i = 1; i <= 7; i++) {
                    ratios.push(i * Math.pow(spread, i - 1) * stiffness);
                }
                
                const masterGain = this.audioContext.createGain();
                const output = this.audioContext.createGain();
                const oscillators = [];
                const nodes = [masterGain, output];
                
                let maxStopTime = 0;
                
                ratios.forEach((ratio, i) => {
                    const osc = this.audioContext.createOscillator();
                    const gain = this.audioContext.createGain();
                    
                    oscillators.push(osc);
                    nodes.push(gain);
                    
                    osc.frequency.value = pitch * ratio;
                    osc.type = 'sine';
                    
                    const amplitude = 1 / Math.pow(i + 1, 0.7);
                    const partialDecay = decay * Math.pow(Math.max(0.1, damping), i * 0.3);
                    
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(amplitude, now + Math.max(0.001, strike));
                    gain.gain.exponentialRampToValueAtTime(0.01, now + partialDecay);
                    
                    osc.connect(gain);
                    gain.connect(masterGain);
                    
                    osc.start(now);
                    const stopTime = now + partialDecay + 0.1;
                    osc.stop(stopTime);
                    maxStopTime = Math.max(maxStopTime, stopTime);
                });
                
                if (tone > 0) {
                    const filter = this.audioContext.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.value = Math.min(20000, Math.max(100, 4000 * tone));
                    filter.Q.value = resonance;
                    
                    nodes.push(filter);
                    masterGain.connect(filter);
                    filter.connect(output);
                } else {
                    masterGain.connect(output);
                }
                
                return { output, oscillators, nodes, stopTime: maxStopTime };
            }

            createPhysicalDrum(params) {
                const now = this.audioContext.currentTime;
                const { pitch = 120, decay = 0.8, material = 1, tension = 1, strike = 0.003, 
                        position = 0.35, resonance = 5, damping = 0.7 } = params;
                
                const modes = [
                    { ratio: 1.00, amplitude: Math.sin(Math.PI * Math.max(0.01, position)) },
                    { ratio: 2.14 * material, amplitude: Math.sin(2 * Math.PI * Math.max(0.01, position)) * 0.7 },
                    { ratio: 3.00 * material, amplitude: Math.sin(3 * Math.PI * Math.max(0.01, position)) * 0.5 },
                    { ratio: 3.89 * material, amplitude: Math.sin(4 * Math.PI * Math.max(0.01, position)) * 0.3 },
                    { ratio: 5.14 * material, amplitude: Math.sin(5 * Math.PI * Math.max(0.01, position)) * 0.2 }
                ];
                
                const masterGain = this.audioContext.createGain();
                const output = this.audioContext.createGain();
                const oscillators = [];
                const nodes = [masterGain, output];
                
                let maxStopTime = 0;
                
                modes.forEach((mode, i) => {
                    const osc = this.audioContext.createOscillator();
                    const gain = this.audioContext.createGain();
                    
                    oscillators.push(osc);
                    nodes.push(gain);
                    
                    const freq = pitch * mode.ratio * Math.max(0.1, tension);
                    osc.frequency.value = freq;
                    osc.type = 'sine';
                    
                    const partialDecay = decay * Math.pow(Math.max(0.1, damping), i * 0.4);
                    const amp = Math.abs(mode.amplitude) * (1 / Math.sqrt(i + 1));
                    
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(amp, now + Math.max(0.001, strike));
                    gain.gain.exponentialRampToValueAtTime(0.01, now + partialDecay);
                    
                    osc.connect(gain);
                    gain.connect(masterGain);
                    
                    osc.start(now);
                    const stopTime = now + partialDecay + 0.1;
                    osc.stop(stopTime);
                    maxStopTime = Math.max(maxStopTime, stopTime);
                });
                
                const filter = this.audioContext.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = Math.min(20000, Math.max(100, 3000 + resonance * 500));
                filter.Q.value = resonance * 0.8;
                
                nodes.push(filter);
                masterGain.connect(filter);
                filter.connect(output);
                
                return { output, oscillators, nodes, stopTime: maxStopTime };
            }

            playDrum(trackId, engine, params, fx, velocity = 1) {
                if (!trackId || trackId === 'test') {
                    trackId = 'test_' + Date.now();
                } else {
                    this.stopVoice(trackId);
                }

                const engineMap = {
                    '808': () => this.create808Kick(params),
                    'FM': () => this.createFMDrum(params),
                    'Snare': () => this.createSnareDrum(params),
                    'Noise': () => this.createNoiseDrum(params),
                    'Modal': () => this.createModalDrum(params),
                    'Physical': () => this.createPhysicalDrum(params)
                };

                const createEngine = engineMap[engine];
                if (createEngine) {
                    const voiceInfo = createEngine();
                    const fxInfo = this.applyFX(voiceInfo, fx);
                    
                    const velocityGain = this.audioContext.createGain();
                    velocityGain.gain.value = velocity;
                    fxInfo.output.connect(velocityGain);
                    velocityGain.connect(this.masterFXInput);
                    
                    let fxTailTime = 0;
                    if (fx.delay > 0) {
                        fxTailTime = Math.max(fxTailTime, (fx.delayTime || 0.25) * 5);
                    }
                    if (fx.reverb > 0) {
                        fxTailTime = Math.max(fxTailTime, (fx.reverbSize || 2) * 1.5);
                    }
                    if (fx.resonator > 0) {
                        fxTailTime = Math.max(fxTailTime, (fx.resDecay || 0.3) * 2);
                    }
                    
                    const allNodes = [
                        ...(voiceInfo.nodes || []),
                        ...(fxInfo.fxNodes || []),
                        velocityGain
                    ];
                    
                    this.activeVoices.set(trackId, {
                        oscillators: voiceInfo.oscillators,
                        sources: voiceInfo.sources,
                        nodes: allNodes,
                        outputGain: velocityGain
                    });
                    
                    const cleanupTime = voiceInfo.stopTime + fxTailTime;
                    this.scheduleCleanup(allNodes, cleanupTime);
                    
                    const cleanupDelay = Math.max(0, (cleanupTime - this.audioContext.currentTime) * 1000 + 100);
                    setTimeout(() => {
                        this.activeVoices.delete(trackId);
                    }, cleanupDelay);
                }
            }

            playDrumWithSlide(trackId, engine, startParams, targetParams, startFX, targetFX, velocity, duration) {
                this.stopVoice(trackId);
                // For simplicity, just play the start sound (slide implementation would be more complex)
                this.playDrum(trackId, engine, startParams, startFX, velocity);
            }
        }

        function generateRandomParams(engineId) {
            const engineSpec = ENGINE_SPECS[engineId];
            const randomParams = {};
            Object.entries(engineSpec.params).forEach(([key, spec]) => {
                const range = spec.max - spec.min;
                randomParams[key] = spec.min + Math.random() * range;
            });
            return randomParams;
        }

        function generateRandomFX() {
            const randomFX = {};
            Object.entries(FX_SPECS).forEach(([key, spec]) => {
                const range = spec.max - spec.min;
                randomFX[key] = spec.min + Math.random() * range;
            });
            return randomFX;
        }

        function getMorphedState(track) {
            if (!track.targetParams || track.morphAmount === 0) {
                return {
                    engine: track.engine,
                    params: { ...track.params },
                    fx: { ...track.fx }
                };
            }
            
            const t = track.morphAmount / 100;
            const morphedParams = {};
            const morphedFX = {};
            
            Object.keys(track.params).forEach(key => {
                const current = track.params[key];
                const target = track.targetParams.params[key];
                morphedParams[key] = lerp(current, target !== undefined ? target : current, t);
            });
            
            Object.keys(track.fx).forEach(key => {
                const current = track.fx[key];
                const target = track.targetParams.fx[key];
                morphedFX[key] = lerp(current, target !== undefined ? target : current, t);
            });
            
            return {
                engine: t > 0.5 ? track.targetParams.engine : track.engine,
                params: morphedParams,
                fx: morphedFX
            };
        }

        function shouldTrigger(condition, currentBar) {
            if (condition === '1:1') return true;
            
            const [bar, total] = condition.split(':').map(Number);
            const barInPattern = currentBar % total;
            return barInPattern === (bar - 1);
        }

        // Tempo Knob Functions
        function setupTempoKnob() {
            const knob = document.getElementById('tempo-knob');
            
            knob.addEventListener('mousedown', startKnobDrag);
            document.addEventListener('mousemove', handleKnobDrag);
            document.addEventListener('mouseup', stopKnobDrag);
            
            updateKnobRotation();
        }

        function startKnobDrag(e) {
            e.preventDefault();
            const rect = e.target.getBoundingClientRect();
            knobDragState = {
                startY: e.clientY,
                startTempo: state.tempo
            };
        }

        function handleKnobDrag(e) {
            if (!knobDragState) return;
            
            const deltaY = knobDragState.startY - e.clientY;
            const sensitivity = 0.5;
            
            let newTempo = knobDragState.startTempo + (deltaY * sensitivity);
            newTempo = Math.max(40, Math.min(300, Math.round(newTempo)));
            
            if (newTempo !== state.tempo) {
                state.tempo = newTempo;
                updateKnobRotation();
                
                if (state.isPlaying) {
                    stopSequencer();
                    startSequencer();
                }
            }
        }

        function stopKnobDrag() {
            knobDragState = null;
        }

        function updateKnobRotation() {
            const knob = document.getElementById('tempo-knob');
            const value = document.getElementById('tempo-value');
            
            // Map tempo (40-300) to rotation (-135 to 135 degrees)
            const minTempo = 40;
            const maxTempo = 300;
            const minAngle = -135;
            const maxAngle = 135;
            
            const percentage = (state.tempo - minTempo) / (maxTempo - minTempo);
            const angle = minAngle + (percentage * (maxAngle - minAngle));
            
            knob.style.transform = `rotate(${angle}deg)`;
            value.textContent = state.tempo;
        }

            const probSlider = document.createElement('input');
            probSlider.type = 'range';
            probSlider.className = 'pattern-mini-slider';
            probSlider.min = 0;
            probSlider.max = 100;
            probSlider.value = pattern.probability;
            probSlider.oninput = (e) => {
                pattern.probability = parseInt(e.target.value);
                cell.querySelector('.pattern-value-display').textContent = pattern.probability + '%';
            };
            
            const probValue = document.createElement('div');
            probValue.className = 'pattern-value-display';
            probValue.textContent = pattern.probability + '%';

            probRow.appendChild(probSlider);

            cell.appendChild(buttonsRow1);
            cell.appendChild(buttonsRow2);
            cell.appendChild(stepsRow);
