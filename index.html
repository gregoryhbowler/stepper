<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stepper enhanced</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            overflow-x: hidden;
            overflow-y: auto;
            user-select: none;
            min-height: 100vh;
        }

        .app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .title {
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 2px;
            color: #666;
        }

        .transport {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:hover {
            background: #252525;
            border-color: #444;
        }

        .btn.active {
            background: #4a9eff;
            border-color: #4a9eff;
            color: #000;
            transform: scale(0.97);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn.secondary {
            background: transparent;
            border-color: #333;
        }

        .btn.warning {
            border-color: #ff6b4a;
            color: #ff6b4a;
        }

        .btn.warning:hover {
            background: #ff6b4a;
            color: #000;
        }

        /* Tempo Knob */
        .tempo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .tempo-label {
            font-size: 11px;
            color: #666;
            font-weight: 600;
        }

        .tempo-knob-container {
            position: relative;
            width: 60px;
            height: 60px;
        }

        .tempo-knob {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #2a2a2a, #1a1a1a);
            border: 2px solid #333;
            position: relative;
            cursor: grab;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .tempo-knob:active {
            cursor: grabbing;
        }

        .tempo-knob::after {
            content: '';
            position: absolute;
            width: 4px;
            height: 20px;
            background: #4a9eff;
            border-radius: 2px;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 8px #4a9eff;
        }

        .tempo-value {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            font-weight: 600;
            color: #4a9eff;
            white-space: nowrap;
        }

        .bar-indicator {
            font-size: 11px;
            color: #4a9eff;
            font-weight: 600;
            padding: 12px 16px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
        }

        /* Pattern Sequencer */
        .pattern-sequencer-panel {
            background: #151515;
            border: 1px solid #252525;
            border-radius: 6px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 300px;
            overflow-y: auto;
        }

        .pattern-sequencer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #252525;
        }

        .pattern-sequencer-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #666;
        }

        .pattern-sequencer-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .pattern-mode-select {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
        }

        #pattern-seq-toggle.active {
            background: #ffffff;
            border-color: #ffffff;
            color: #000;
        }

        .pattern-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 10px;
        }

        .pattern-cell {
            background: #1a1a1a;
            border: 1px solid #252525;
            border-radius: 4px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .pattern-cell:hover {
            border-color: #444;
        }

        .pattern-cell.active {
            border-color: #4a9eff;
            box-shadow: 0 0 10px rgba(74, 158, 255, 0.3);
        }

        .pattern-cell.selected {
            border-color: #ffd700;
            background: #2a2510;
        }

        .pattern-cell.has-data {
            background: #1f1f1f;
            border-color: #333;
        }

        .pattern-cell.selected.has-data {
            background: #2a2510;
            border-color: #ffd700;
        }

        .pattern-cell-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pattern-number {
            font-size: 10px;
            font-weight: 700;
            color: #666;
            letter-spacing: 1px;
        }

        .pattern-header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pattern-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #333;
        }

        .pattern-cell.has-data .pattern-indicator {
            background: #4a9eff;
        }

        .pattern-loop-btn {
            width: 20px;
            height: 20px;
            background: #252525;
            border: 1px solid #333;
            border-radius: 3px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            font-weight: 700;
            color: #666;
            transition: all 0.2s;
        }

        .pattern-loop-btn:hover {
            border-color: #4a9eff;
            color: #4a9eff;
        }

        .pattern-loop-btn.active {
            background: #4a9eff;
            border-color: #4a9eff;
            color: #000;
        }

        .pattern-buttons {
            display: flex;
            gap: 4px;
        }

        .pattern-mini-btn {
            flex: 1;
            background: #252525;
            border: 1px solid #333;
            color: #999;
            padding: 6px 4px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .pattern-mini-btn:hover {
            border-color: #4a9eff;
            color: #4a9eff;
        }

        .pattern-mini-btn.copy-active {
            background: #4a9eff;
            border-color: #4a9eff;
            color: #000;
        }

        .pattern-buttons-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }

        .pattern-select-row {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .pattern-select-label {
            font-size: 8px;
            color: #666;
            font-weight: 600;
            min-width: 35px;
        }

        .pattern-dropdown {
            flex: 1;
            background: #252525;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 4px;
            border-radius: 3px;
            font-size: 9px;
            cursor: pointer;
        }

        .pattern-slider-row {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .pattern-mini-slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 2px;
            background: #252525;
            outline: none;
            border-radius: 2px;
            cursor: pointer;
        }

        .pattern-mini-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            background: #4a9eff;
            cursor: grab;
            border-radius: 50%;
        }

        .pattern-mini-slider::-moz-range-thumb {
            width: 10px;
            height: 10px;
            background: #4a9eff;
            cursor: grab;
            border-radius: 50%;
            border: none;
        }

        .pattern-value-display {
            font-size: 9px;
            color: #4a9eff;
            min-width: 30px;
            text-align: right;
            font-weight: 600;
        }

        .main-content {
            display: flex;
            gap: 20px;
            flex: 1;
            min-height: 400px;
            overflow: hidden;
            position: relative;
        }

        .tracks-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            padding-right: 10px;
            min-height: 200px;
        }

        /* Mobile styles */
        @media (max-width: 768px) {
            .pattern-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .track {
            background: #151515;
            border: 1px solid #252525;
            border-radius: 6px;
            padding: 15px;
            display: flex;
            gap: 15px;
            align-items: stretch;
            transition: all 0.2s;
        }

        .track:hover {
            border-color: #333;
        }

        .track.selected {
            border-color: #4a9eff;
        }

        .track.muted {
            opacity: 0.5;
        }

        .track-header {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 100px;
        }

        .track-name {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .track-controls {
            display: flex;
            gap: 8px;
        }

        .track-btn {
            width: 32px;
            height: 32px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 3px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            transition: all 0.2s;
        }

        .track-btn:hover {
            border-color: #4a9eff;
        }

        .track-btn.active {
            background: #4a9eff;
            border-color: #4a9eff;
            color: #000;
        }

        .sequencer {
            display: flex;
            gap: 4px;
            flex: 1;
        }

        .step-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .lock-buttons {
            display: flex;
            gap: 3px;
        }

        .lock-btn {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #252525;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.1s;
            font-size: 9px;
            font-weight: 600;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px;
            width: 20px;
            height: 20px;
        }

        .lock-btn:hover {
            border-color: #4a9eff;
            color: #4a9eff;
        }

        .lock-btn.active {
            background: #4a9eff;
            border-color: #4a9eff;
            color: #000;
        }

        .lock-btn.slide-active {
            background: #ff6b4a;
            border-color: #ff6b4a;
            color: #000;
        }

        .step {
            flex: 1;
            min-height: 50px;
            background: #1a1a1a;
            border: 1px solid #252525;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.1s;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            overflow: hidden;
        }

        .step:hover {
            border-color: #4a9eff;
        }

        .step.active {
            background: #4a4a4a;
            border-color: #666;
        }

        .step.playing {
            box-shadow: 0 0 15px #4a9eff;
        }

        .step.beat-4 {
            border-left: 2px solid #333;
        }

        .step.has-locks {
            background: #6b5a00;
            border-color: #ffd700;
        }

        .step.has-locks.active {
            background: #8b7500;
        }

        .velocity-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, #4a9eff, rgba(74, 158, 255, 0.3));
            pointer-events: none;
            transition: height 0.1s;
        }

        .velocity-value {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 9px;
            font-weight: 600;
            color: #4a9eff;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }

        .step:hover .velocity-value {
            opacity: 1;
        }

        .step-condition {
            width: 100%;
            background: #0d0d0d;
            border: 1px solid #252525;
            border-radius: 2px;
            color: #888;
            font-size: 9px;
            padding: 3px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
        }

        .step-condition:hover {
            border-color: #4a9eff;
            color: #4a9eff;
        }

        .side-panel {
            width: 450px;
            background: #151515;
            border: 1px solid #252525;
            border-radius: 6px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .side-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #252525;
        }

        .side-panel-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #4a9eff;
        }

        .close-panel-btn {
            display: none;
            padding: 8px 16px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 3px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 600;
            color: #e0e0e0;
            transition: all 0.2s;
        }

        .close-panel-btn:hover {
            border-color: #4a9eff;
            color: #4a9eff;
        }

        #trigger-btn {
            display: block;
        }

        @media (max-width: 768px) {
            .close-panel-btn {
                display: block;
            }

            #trigger-btn {
                display: block;
            }
        }

        .section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .section-title {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #666;
            border-bottom: 1px solid #252525;
            padding-bottom: 8px;
        }

        .param-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .param {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .param-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #999;
        }

        .param-value {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 3px;
            background: #252525;
            outline: none;
            border-radius: 2px;
            cursor: pointer;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            background: #4a9eff;
            cursor: grab;
            border-radius: 50%;
        }

        .slider:active::-webkit-slider-thumb {
            cursor: grabbing;
        }

        .slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: #4a9eff;
            cursor: grab;
            border-radius: 50%;
            border: none;
        }

        .value-display {
            font-size: 11px;
            font-weight: 600;
            color: #4a9eff;
            min-width: 50px;
            text-align: right;
        }

        .engine-select {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .engine-btn {
            padding: 8px 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 3px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .engine-btn:hover {
            border-color: #4a9eff;
        }

        .engine-btn.active {
            background: #4a9eff;
            border-color: #4a9eff;
            color: #000;
        }

        .morph-control {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .morph-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .morph-title {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #999;
        }

        .morph-buttons {
            display: flex;
            gap: 8px;
        }

        .morph-btn {
            padding: 6px 12px;
            background: transparent;
            border: 1px solid #333;
            border-radius: 3px;
            cursor: pointer;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #e0e0e0;
            transition: all 0.2s;
        }

        .morph-btn:hover {
            border-color: #4a9eff;
            color: #4a9eff;
        }

        .fx-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #444;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #151515;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 30px;
            max-width: 350px;
        }

        .modal-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 20px;
        }

        .condition-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .condition-option {
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 3px;
            cursor: pointer;
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .condition-option:hover {
            border-color: #4a9eff;
            color: #4a9eff;
        }

        .modal-input {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 12px;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .global-controls {
            background: #151515;
            border: 1px solid #252525;
            border-radius: 6px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="title">stepper</div>
            <div class="transport">
                <div class="bar-indicator" id="bar-indicator">Bar: 1/4</div>
                <div class="tempo">
                    <span class="tempo-label">TEMPO</span>
                    <div class="tempo-knob-container">
                        <div class="tempo-knob" id="tempo-knob"></div>
                        <div class="tempo-value" id="tempo-value">128</div>
                    </div>
                </div>
                <button class="btn" id="play-btn">PLAY</button>
                <button class="btn secondary" id="reset-btn">RESET</button>
            </div>
        </div>

        <div class="pattern-sequencer-panel">
            <div class="pattern-sequencer-header">
                <div class="pattern-sequencer-title">PATTERN SEQUENCER</div>
                <div class="pattern-sequencer-controls">
                    <select class="pattern-mode-select" id="pattern-mode">
                        <option value="forward">FORWARD</option>
                        <option value="pingpong">FORWARD & BACK</option>
                        <option value="random">RANDOM</option>
                        <option value="instant">INSTANT</option>
                        <option value="next">NEXT</option>
                    </select>
                    <button class="btn secondary" id="pattern-seq-toggle">ENABLE</button>
                </div>
            </div>
            <div class="pattern-grid" id="pattern-grid"></div>
        </div>

        <div class="main-content">
            <div class="tracks-panel" id="tracks-panel"></div>

            <div class="side-panel" id="side-panel">
                <div class="side-panel-header">
                    <div class="side-panel-title" id="synth-title">SYNTHESIS</div>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <button class="btn secondary" id="trigger-btn" style="padding: 8px 16px; font-size: 10px;">TRIGGER</button>
                        <button class="close-panel-btn" id="close-panel-btn">CLOSE</button>
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">ENGINE</div>
                    <div class="engine-select" id="engine-select"></div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                        <button class="btn secondary" id="set-normal-btn">SET NORMAL</button>
                        <button class="btn secondary" id="recall-normal-btn">RECALL NORMAL</button>
                    </div>
                </div>

            return a + (b - a) * t;

        function initializeTrackDefaults(trackId) {
            console.log('Initializing track:', trackId);
            const track = state.tracks[trackId];
            const engineSpec = ENGINE_SPECS[track.engine];

                track.params[key] = spec.default;

            track.fx = {};
            Object.entries(FX_SPECS).forEach(([key, spec]) => {

            setNormalState(trackId);

        function generateRandomParams(engineId) {
            const engineSpec = ENGINE_SPECS[engineId];
            const randomParams = {};
            Object.entries(engineSpec.params).forEach(([key, spec]) => {
                const range = spec.max - spec.min;
                randomParams[key] = spec.min + Math.random() * range;
            });
            return randomParams;
        }

        function generateRandomFX() {
            const randomFX = {};
            Object.entries(FX_SPECS).forEach(([key, spec]) => {
                const range = spec.max - spec.min;
                randomFX[key] = spec.min + Math.random() * range;
            });
            return randomFX;
        }

        function getMorphedState(track) {
            if (!track.targetParams || track.morphAmount === 0) {
                return {
                    engine: track.engine,
                    params: { ...track.params },
                    fx: { ...track.fx }
                };
            }
            
            const t = track.morphAmount / 100;
            const morphedParams = {};
            const morphedFX = {};
            
            Object.keys(track.params).forEach(key => {
                const current = track.params[key];
                const target = track.targetParams.params[key];
                morphedParams[key] = lerp(current, target !== undefined ? target : current, t);
            });
            
            Object.keys(track.fx).forEach(key => {
                const current = track.fx[key];
                const target = track.targetParams.fx[key];
                morphedFX[key] = lerp(current, target !== undefined ? target : current, t);
            });
            
            return {
                engine: t > 0.5 ? track.targetParams.engine : track.engine,
                params: morphedParams,
                fx: morphedFX
            };
        }

        function shouldTrigger(condition, currentBar) {
            if (condition === '1:1') return true;
            
            const [bar, total] = condition.split(':').map(Number);
            const barInPattern = currentBar % total;
            return barInPattern === (bar - 1);
        }

        // Tempo Knob Functions
        function setupTempoKnob() {
            console.log('Setting up tempo knob...');
            const knob = document.getElementById('tempo-knob');
            
            knob.addEventListener('mousedown', startKnobDrag);
            document.addEventListener('mousemove', handleKnobDrag);
            document.addEventListener('mouseup', stopKnobDrag);
            
            updateKnobRotation();
        }

        function startKnobDrag(e) {
            e.preventDefault();
            const rect = e.target.getBoundingClientRect();
            knobDragState = {
                startY: e.clientY,
                startTempo: state.tempo
            };
        }

        function handleKnobDrag(e) {
            if (!knobDragState) return;
            
            const deltaY = knobDragState.startY - e.clientY;
            const sensitivity = 0.5;
            
            let newTempo = knobDragState.startTempo + (deltaY * sensitivity);
            newTempo = Math.max(40, Math.min(300, Math.round(newTempo)));
            
            if (newTempo !== state.tempo) {
                state.tempo = newTempo;
                updateKnobRotation();
                
                if (state.isPlaying) {
                    stopSequencer();
                    startSequencer();
                }
            }
        }

        function stopKnobDrag() {
            knobDragState = null;
        }

        function updateKnobRotation() {
            const knob = document.getElementById('tempo-knob');
            const value = document.getElementById('tempo-value');
            
            const minTempo = 40;
            const maxTempo = 300;
            const minAngle = -135;
            const maxAngle = 135;
            
            const percentage = (state.tempo - minTempo) / (maxTempo - minTempo);
            const angle = minAngle + (percentage * (maxAngle - minAngle));
            
            knob.style.transform = `rotate(${angle}deg)`;
            value.textContent = state.tempo;
        }

        function togglePatternLoop(index) {

        }

        function selectPattern(index) {
            const pattern = state.patterns[index];
            
            if (state.patternSequencerMode === 'instant') {
                if (pattern.data) {
                    state.selectedPattern = index;
                    
                    const currentPatternLength = state.patterns[state.currentPattern].steps;
                    const newPatternLength = pattern.steps;
                    let equivalentStep;
                    
                    if (state.currentStep >= 0) {
                        const progressRatio = (state.patternStepCount % currentPatternLength) / currentPatternLength;
                        equivalentStep = Math.floor(progressRatio * newPatternLength);
                    } else {
                        equivalentStep = 0;
                    }
                    
                    state.currentPattern = index;
                    state.patternStepCount = equivalentStep;
                    loadPattern(index);
                    
                    if (!state.isPlaying) {
                        togglePlay();
                    }
                }
            } else if (state.patternSequencerMode === 'next') {
                if (pattern.data) {
                    state.selectedPattern = index;
                    state.nextPatternQueued = index;
                    
                    if (!state.isPlaying) {
                        state.currentPattern = index;
                        loadPattern(index);
                        state.patternStepCount = 0;
                        togglePlay();
                    }
                }
            } else {
                state.selectedPattern = index;
                if (pattern.data) {
                    loadPattern(index);
                }
            }
            
            renderPatternSequencer();
        }

        function loadPattern(index) {
            const pattern = state.patterns[index];
            
            if (!pattern.data) return;
            
            Object.entries(pattern.data).forEach(([trackId, data]) => {
                const track = state.tracks[trackId];
                if (track) {
                    track.steps = [...data.steps];
                    track.velocities = [...data.velocities];
                    track.stepConditions = [...data.stepConditions];
                    track.stepLocks = data.stepLocks.map(lock => lock ? { ...lock } : null);
                    track.stepSlides = [...data.stepSlides];
                }
            });
            
            renderTracks();
        }

        function handleStepMouseDown(e, trackId, stepIndex) {
            e.preventDefault();
            e.stopPropagation();
            
            const startY = e.clientY;
            const startVelocity = state.tracks[trackId].velocities[stepIndex];
            
            dragState = {
                trackId,
                stepIndex,
                startY,
                startVelocity,
                isDragging: false,
                wasActive: state.tracks[trackId].steps[stepIndex]
            };
            
            const handleMouseMove = (moveEvent) => {
                if (!dragState) return;
                
                const deltaY = dragState.startY - moveEvent.clientY;
                const sensitivity = 0.003;
                
                if (Math.abs(deltaY) > 3) {
                    dragState.isDragging = true;
                }
                
                if (dragState.isDragging) {
                    let newVelocity = dragState.startVelocity + (deltaY * sensitivity);
                    newVelocity = Math.max(0, Math.min(1, newVelocity));
                    
                    state.tracks[trackId].velocities[stepIndex] = newVelocity;
                    
                    if (!state.tracks[trackId].steps[stepIndex]) {
                        state.tracks[trackId].steps[stepIndex] = true;
                    }
                    
                    renderTracks();
                }
            };
            
            const handleMouseUp = () => {
                if (dragState && !dragState.isDragging) {
                    toggleStep(trackId, stepIndex);
                }
                
                dragState = null;
                document.removeEventListener('mousemove', handleMouseMove);
                document.removeEventListener('mouseup', handleMouseUp);
            };
            
            document.addEventListener('mousemove', handleMouseMove);
            document.addEventListener('mouseup', handleMouseUp);
        }

                btn.classList.remove('active');

        function startSequencer() {
            const stepDuration = (60 / state.tempo) * 1000 / 4;
            
            sequencerInterval = setInterval(() => {
                state.currentStep = (state.currentStep + 1) % 16;
                state.stepInBar++;
                
                if (state.stepInBar >= 16) {
                    state.stepInBar = 0;
                    state.currentBar = (state.currentBar + 1) % 4;
                    updateBarIndicator();
                }
                
                Object.entries(state.tracks).forEach(([trackId, track]) => {
                    const condition = track.stepConditions[state.currentStep];
                    
                    if (track.steps[state.currentStep] && !track.mute && shouldTrigger(condition, state.currentBar)) {
                        const velocity = track.velocities[state.currentStep];
                        
                        let baseEngine, baseParams, baseFX;
                        const currentLock = track.stepLocks[state.currentStep];
                        
                        if (currentLock) {
                            baseEngine = currentLock.engine;
                            baseParams = currentLock.params;
                            baseFX = currentLock.fx;
                        } else if (track.normalState) {
                            baseEngine = track.normalState.engine;
                            baseParams = track.normalState.params;
                            baseFX = track.normalState.fx;
                        } else {
                            baseEngine = track.engine;
                            baseParams = track.params;
                            baseFX = track.fx;
                        }
                        
                        audioEngine.playDrum(trackId, baseEngine, baseParams, baseFX, velocity);
                    }
                });
                
                document.querySelectorAll('.step').forEach(step => {
                    step.classList.remove('playing');
                });
                document.querySelectorAll(`.step-container:nth-child(${state.currentStep + 1}) .step`).forEach(step => {
                    step.classList.add('playing');
                });
            }, stepDuration);
        }

        function stopSequencer() {
            if (sequencerInterval) {
                clearInterval(sequencerInterval);
                sequencerInterval = null;
            }
            
            Object.keys(state.tracks).forEach(trackId => {
                if (audioEngine && audioEngine.initialized) {
                    audioEngine.stopVoice(trackId);
                }
            });
            
            document.querySelectorAll('.step').forEach(step => {
                step.classList.remove('playing');
            });
        }

        function updateBarIndicator() {
            document.getElementById('bar-indicator').textContent = `Bar: ${state.currentBar + 1}/4`;
        }

        function reset() {
            const wasPlaying = state.isPlaying;
            
            if (wasPlaying) {
                stopSequencer();
            }
            
            state.currentStep = -1;
            state.currentBar = 0;
            state.stepInBar = 0;
            state.patternStepCount = 0;
            updateBarIndicator();
            renderTracks();
            
            if (wasPlaying) {
                startSequencer();
            }
        }

        function selectTrack(trackId) {
            state.selectedTrack = trackId;
            renderTracks();
            renderSidebar();
        }

        function toggleStep(trackId, stepIndex) {
            state.tracks[trackId].steps[stepIndex] = !state.tracks[trackId].steps[stepIndex];
            renderTracks();
        }

        function togglePLock(trackId, stepIndex) {
            const track = state.tracks[trackId];
            
            if (track.stepLocks[stepIndex]) {
                track.stepLocks[stepIndex] = null;
            } else {
                track.stepLocks[stepIndex] = {
                    engine: track.engine,
                    params: { ...track.params },
                    fx: { ...track.fx }
                };
            }
            
            renderTracks();
        }

        function toggleSLock(trackId, stepIndex) {
            const track = state.tracks[trackId];
            track.stepSlides[stepIndex] = !track.stepSlides[stepIndex];
            renderTracks();
        }

        function toggleMute(trackId) {
            state.tracks[trackId].mute = !state.tracks[trackId].mute;
            renderTracks();
        }

        function randomizePattern(trackId) {
            const density = 0.25 + Math.random() * 0.3;
            state.tracks[trackId].steps = Array(16).fill(false).map(() => Math.random() < density);
            state.tracks[trackId].velocities = Array(16).fill(0).map(() => 0.4 + Math.random() * 0.6);
            renderTracks();
        }

        function clearPattern(trackId) {
            state.tracks[trackId].steps = Array(16).fill(false);
            renderTracks();
        }

        function changeEngine(engineId) {
            const track = state.tracks[state.selectedTrack];
            track.engine = engineId;
            
            const engineSpec = ENGINE_SPECS[engineId];
            const newParams = {};
            Object.entries(engineSpec.params).forEach(([key, spec]) => {
                newParams[key] = spec.default;
            });
            track.params = newParams;
            
            const newFX = {};
            Object.entries(FX_SPECS).forEach(([key, spec]) => {
                newFX[key] = spec.default;
            });
            track.fx = newFX;
            
            setNormalState(state.selectedTrack);
            
            const btn = document.getElementById('set-normal-btn');
            if (btn) {
                const originalText = btn.textContent;
                btn.textContent = 'AUTO SAVED';
                btn.classList.add('active');
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('active');
                }, 500);
            }
            
            renderTracks();
            renderSidebar();
        }

        function updateParam(key, value) {
            const track = state.tracks[state.selectedTrack];
            track.params[key] = value;
            
            if (track.morphAmount > 0) {
                track.morphAmount = 0;
                track.targetParams = null;
                document.getElementById('track-morph-slider').value = 0;
                document.getElementById('track-morph-value').textContent = '0%';
            }
        }

        function updateFX(key, value) {
            const track = state.tracks[state.selectedTrack];
            track.fx[key] = value;
            
            if (track.morphAmount > 0) {
                track.morphAmount = 0;
                track.targetParams = null;
                document.getElementById('track-morph-slider').value = 0;
                document.getElementById('track-morph-value').textContent = '0%';
            }
        }

        function clearAllLocks() {
            const track = state.tracks[state.selectedTrack];
            track.stepLocks = Array(16).fill(null);
            renderTracks();
        }

        function generateGlobalTarget() {
            Object.keys(state.tracks).forEach(trackId => {
                const track = state.tracks[trackId];
                track.targetParams = {
                    engine: track.engine,
                    params: generateRandomParams(track.engine),
                    fx: generateRandomFX()
                };
            });
        }

        function lockGlobalTarget() {
            Object.keys(state.tracks).forEach(trackId => {
                const track = state.tracks[trackId];
                if (track.targetParams) {
                    const morphed = getMorphedState(track);
                    track.params = { ...morphed.params };
                    track.fx = { ...morphed.fx };
                    track.targetParams = null;
                }
            });
            
            state.globalMorphAmount = 0;
            document.getElementById('global-morph-slider').value = 0;
            document.getElementById('global-morph-value').textContent = '0%';
            
            renderParams();
            renderFX();
        }

        function generateTrackTarget() {
            const track = state.tracks[state.selectedTrack];
            track.targetParams = {
                engine: track.engine,
                params: generateRandomParams(track.engine),
                fx: generateRandomFX()
            };
            
            const btn = document.getElementById('track-generate-btn');
            const originalText = btn.textContent;
            btn.textContent = 'GENERATED!';
            setTimeout(() => {
                btn.textContent = originalText;
            }, 300);
        }

        function lockTrackTarget() {
            const track = state.tracks[state.selectedTrack];
            if (track.targetParams) {
                const morphed = getMorphedState(track);
                track.params = { ...morphed.params };
                track.fx = { ...morphed.fx };
                track.targetParams = null;
            }
            
            track.morphAmount = 0;
            document.getElementById('track-morph-slider').value = 0;
            document.getElementById('track-morph-value').textContent = '0%';
            
            const btn = document.getElementById('track-lock-btn');
            const originalText = btn.textContent;
            btn.textContent = 'LOCKED!';
            setTimeout(() => {
                btn.textContent = originalText;
            }, 300);
            
            renderParams();
            renderFX();
        }

        function togglePatternSequencer() {
            // Placeholder
        }

        function openConditionModal(trackId, stepIndex) {
            state.conditionModalTrack = trackId;
            state.conditionModalStep = stepIndex;
            
            const grid = document.getElementById('condition-grid');
            grid.innerHTML = '';
            
            const conditions = [
                '1:1',
                '1:2', '2:2',
                '1:3', '2:3', '3:3',
                '1:4', '2:4', '3:4', '4:4'
            ];
            
            conditions.forEach(condition => {
                const option = document.createElement('div');
                option.className = 'condition-option';
                option.textContent = condition;
                option.onclick = () => setCondition(condition);
                grid.appendChild(option);
            });
            
            document.getElementById('condition-modal').classList.add('active');
        }

        function closeConditionModal() {
            document.getElementById('condition-modal').classList.remove('active');
            state.conditionModalTrack = null;
            state.conditionModalStep = null;
        }

        function setCondition(condition) {
            if (state.conditionModalTrack && state.conditionModalStep !== null) {
                state.tracks[state.conditionModalTrack].stepConditions[state.conditionModalStep] = condition;
                renderTracks();
            }
            closeConditionModal();
        }

        function testSound() {
            if (audioEngine && !audioEngine.initialized) {
                audioEngine.init();
            }
            
            const track = state.tracks[state.selectedTrack];
            const morphedState = getMorphedState(track);
            audioEngine.playDrum(null, morphedState.engine, morphedState.params, morphedState.fx, 0.8);
        }

        function triggerSound() {
            if (audioEngine && !audioEngine.initialized) {
                audioEngine.init();
            }
            
            const track = state.tracks[state.selectedTrack];
            const morphedState = getMorphedState(track);
            audioEngine.playDrum(null, morphedState.engine, morphedState.params, morphedState.fx, 0.8);
            
            const btn = document.getElementById('trigger-btn');
            btn.classList.add('active');
            setTimeout(() => btn.classList.remove('active'), 100);
        }

        // Initialize on DOM ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
