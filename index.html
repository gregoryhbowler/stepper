            updatePatternCell(cell, pattern, index);
            
            return cell;
        }

        function updatePatternCell(cell, pattern, index) {
            cell.classList.toggle('has-data', pattern.data !== null);
            cell.classList.toggle('active', state.patternSequencerEnabled && state.currentPattern === index);
            cell.classList.toggle('selected', state.selectedPattern === index);
            
            // Update loop button
            const loopBtn = cell.querySelector('.pattern-loop-btn');
            if (loopBtn) {
                loopBtn.classList.toggle('active', pattern.loop);
            }
        }

        function writePattern(index) {
            const pattern = state.patterns[index];
            
            // Deep copy all track data
            pattern.data = {};
            Object.entries(state.tracks).forEach(([trackId, track]) => {
                pattern.data[trackId] = {
                    steps: [...track.steps],
                    velocities: [...track.velocities],
                    stepConditions: [...track.stepConditions],
                    stepLocks: track.stepLocks.map(lock => lock ? { ...lock } : null),
                    stepSlides: [...track.stepSlides]
                };
            });
            
            renderPatternSequencer();
        }

        function clearPatternData(index) {
            state.patterns[index].data = null;
            renderPatternSequencer();
        }

        function copyPattern(index) {
            const pattern = state.patterns[index];
            if (!pattern.data) return;
            
            // Deep copy the pattern data
            state.copiedPattern = {
                data: JSON.parse(JSON.stringify(pattern.data)),
                steps: pattern.steps,
                probability: pattern.probability,
                loop: pattern.loop
            };
            
            // Visual feedback - find the copy button for this pattern
            const grid = document.getElementById('pattern-grid');
            const cell = grid.children[index];
            const buttonRows = cell.querySelectorAll('.pattern-buttons-row');
            if (buttonRows.length > 1) {
                const copyBtn = buttonRows[1].querySelector('.pattern-mini-btn:first-child');
                if (copyBtn) {
                    copyBtn.classList.add('copy-active');
                    setTimeout(() => {
                        copyBtn.classList.remove('copy-active');
                    }, 200);
                }
            }
        }

        function pastePattern(index) {
            if (!state.copiedPattern) return;
            
            const pattern = state.patterns[index];
            
            // Deep copy from clipboard
            pattern.data = JSON.parse(JSON.stringify(state.copiedPattern.data));
            pattern.steps = state.copiedPattern.steps;
            pattern.probability = state.copiedPattern.probability;
            pattern.loop = state.copiedPattern.loop;
            
            // Visual feedback - find the paste button for this pattern
            const grid = document.getElementById('pattern-grid');
            const cell = grid.children[index];
            const buttonRows = cell.querySelectorAll('.pattern-buttons-row');
            if (buttonRows.length > 1) {
                const pasteBtn = buttonRows[1].querySelector('.pattern-mini-btn:last-child');
                if (pasteBtn) {
                    pasteBtn.classList.add('copy-active');
                    setTimeout(() => {
                        pasteBtn.classList.remove('copy-active');
                    }, 200);
                }
            }
            
            renderPatternSequencer();
        }

        function getWrittenPatterns() {
            return state.patterns
                .map((p, i) => ({ pattern: p, index: i }))
                .filter(p => p.pattern.data !== null);
        }

        function findNextWrittenPattern(currentIndex) {
            const written = getWrittenPatterns();
            if (written.length === 0) return -1;
            
            // Find current position in written array
            const currentPos = written.findIndex(p => p.index === currentIndex);
            
            if (currentPos === -1) {
                // Current pattern not in written list, start from beginning
                return written[0].index;
            }
            
            // Move to next, loop back to start if at end
            const nextPos = (currentPos + 1) % written.length;
            return written[nextPos].index;
        }

        function findPreviousWrittenPattern(currentIndex) {
            const written = getWrittenPatterns();
            if (written.length === 0) return -1;
            
            const currentPos = written.findIndex(p => p.index === currentIndex);
            
            if (currentPos === -1) {
                return written[written.length - 1].index;
            }
            
            const prevPos = (currentPos - 1 + written.length) % written.length;
            return written[prevPos].index;
        }

        function getRandomWrittenPattern() {
            const written = getWrittenPatterns();
            if (written.length === 0) return -1;
            if (written.length === 1) return written[0].index;
            
            // Pick a random pattern that's not the current one
            let randomPattern;
            do {
                randomPattern = written[Math.floor(Math.random() * written.length)];
            } while (randomPattern.index === state.currentPattern);
            
            return randomPattern.index;
        }

        function togglePatternLoop(index) {
            state.patterns[index].loop = !state.patterns[index].loop;
            renderPatternSequencer();
        }

        function selectPattern(index) {
            const pattern = state.patterns[index];
            
            // In instant and next modes, handle pattern selection differently
            if (state.patternSequencerMode === 'instant') {
                if (pattern.data) {
                    state.selectedPattern = index;
                    
                    // Calculate equivalent step position
                    const currentPatternLength = state.patterns[state.currentPattern].steps;
                    const newPatternLength = pattern.steps;
                    let equivalentStep;
                    
                    if (state.currentStep >= 0) {
                        // Map current position to equivalent position in new pattern
                        const progressRatio = (state.patternStepCount % currentPatternLength) / currentPatternLength;
                        equivalentStep = Math.floor(progressRatio * newPatternLength);
                    } else {
                        equivalentStep = 0;
                    }
                    
                    // Switch immediately
                    state.currentPattern = index;
                    state.patternStepCount = equivalentStep;
                    loadPattern(index);
                    
                    if (!state.isPlaying) {
                        // Start playing if not already
                        togglePlay();
                    }
                }
            } else if (state.patternSequencerMode === 'next') {
                if (pattern.data) {
                    state.selectedPattern = index;
                    state.nextPatternQueued = index;
                    
                    if (!state.isPlaying) {
                        // Start playing immediately
                        state.currentPattern = index;
                        loadPattern(index);
                        state.patternStepCount = 0;
                        togglePlay();
                    }
                }
            } else {
                // For other modes, just select and load for editing
                state.selectedPattern = index;
                if (pattern.data) {
                    loadPattern(index);
                }
            }
            
            renderPatternSequencer();
        }

        function loadPattern(index) {
            const pattern = state.patterns[index];
            
            if (!pattern.data) return;
            
            // Load pattern data into tracks
            Object.entries(pattern.data).forEach(([trackId, data]) => {
                const track = state.tracks[trackId];
                if (track) {
                    track.steps = [...data.steps];
                    track.velocities = [...data.velocities];
                    track.stepConditions = [...data.stepConditions];
                    track.stepLocks = data.stepLocks.map(lock => lock ? { ...lock } : null);
                    track.stepSlides = [...data.stepSlides];
                }
            });
            
            renderTracks();
        }

        function openCustomStepsModal(patternIndex) {
            customStepTarget = patternIndex;
            document.getElementById('custom-steps-input').value = '';
            document.getElementById('custom-steps-modal').classList.add('active');
            document.getElementById('custom-steps-input').focus();
        }

        function closeCustomStepsModal() {
            document.getElementById('custom-steps-modal').classList.remove('active');
            customStepTarget = null;
        }

        function setCustomSteps() {
            const input = document.getElementById('custom-steps-input');
            const value = parseInt(input.value);
            
            if (value && value > 0 && value < 10000 && customStepTarget !== null) {
                state.patterns[customStepTarget].steps = value;
                renderPatternSequencer();
            }
            
            closeCustomStepsModal();
        }

        function advancePattern() {
            const written = getWrittenPatterns();
            if (written.length === 0) return;
            
            // Check probability
            if (Math.random() * 100 > state.patterns[state.currentPattern].probability) {
                // Skip this pattern
                moveToNextPattern();
                advancePattern(); // Try the next pattern
                return;
            }
            
            // Load the pattern
            loadPattern(state.currentPattern);
            state.patternStepCount = 0;
            renderPatternSequencer();
        }

        function moveToNextPattern() {
            const written = getWrittenPatterns();
            if (written.length === 0) {
                // No written patterns, disable sequencer
                state.patternSequencerEnabled = false;
                const btn = document.getElementById('pattern-seq-toggle');
                btn.classList.remove('active');
                btn.textContent = 'ENABLE';
                return;
            }
            
            // Check if current pattern should loop
            if (state.patterns[state.currentPattern].loop) {
                // Loop current pattern
                return;
            }
            
            // Handle instant mode - just loop the current pattern unless manually switched
            if (state.patternSequencerMode === 'instant') {
                // Pattern was already switched by selectPattern, just loop
                return;
            }
            
            // Handle next mode - play queued pattern or loop current
            if (state.patternSequencerMode === 'next') {
                if (state.nextPatternQueued !== null && state.patterns[state.nextPatternQueued].data) {
                    state.currentPattern = state.nextPatternQueued;
                    state.nextPatternQueued = null;
                    renderPatternSequencer();
                    return;
                }
                // No queued pattern, loop current
                return;
            }
            
            // Original modes: forward, pingpong, random
            switch(state.patternSequencerMode) {
                case 'forward':
                    const nextForward = findNextWrittenPattern(state.currentPattern);
                    if (nextForward !== -1) {
                        state.currentPattern = nextForward;
                    }
                    break;
                    
                case 'pingpong':
                    if (state.patternDirection === 1) {
                        const nextPing = findNextWrittenPattern(state.currentPattern);
                        if (nextPing !== -1) {
                            state.currentPattern = nextPing;
                            // Check if we've reached the last written pattern
                            const writtenIndices = written.map(p => p.index);
                            const maxIndex = Math.max(...writtenIndices);
                            if (state.currentPattern === maxIndex) {
                                state.patternDirection = -1;
                            }
                        }
                    } else {
                        const prevPong = findPreviousWrittenPattern(state.currentPattern);
                        if (prevPong !== -1) {
                            state.currentPattern = prevPong;
                            // Check if we've reached the first written pattern
                            const writtenIndices = written.map(p => p.index);
                            const minIndex = Math.min(...writtenIndices);
                            if (state.currentPattern === minIndex) {
                                state.patternDirection = 1;
                            }
                        }
                    }
                    break;
                    
                case 'random':
                    const nextRandom = getRandomWrittenPattern();
                    if (nextRandom !== -1) {
                        state.currentPattern = nextRandom;
                    }
                    break;
            }
            
            renderPatternSequencer();
        }

        function togglePatternSequencer() {
            state.patternSequencerEnabled = !state.patternSequencerEnabled;
            
            const btn = document.getElementById('pattern-seq-toggle');
            if (state.patternSequencerEnabled) {
                const written = getWrittenPatterns();
                if (written.length === 0) {
                    // No patterns to play
                    state.patternSequencerEnabled = false;
                    alert('Please write at least one pattern before enabling the sequencer.');
                    return;
                }
                
                btn.classList.add('active');
                btn.textContent = 'ENABLED';
                
                // For instant and next modes, don't auto-start
                if (state.patternSequencerMode === 'instant' || state.patternSequencerMode === 'next') {
                    // Just enable, wait for user to select a pattern
                    state.selectedPattern = null;
                    state.nextPatternQueued = null;
                } else {
                    // Start from the first written pattern for other modes
                    state.currentPattern = written[0].index;
                    state.patternStepCount = 0;
                    state.patternDirection = 1;
                    advancePattern();
                }
            } else {
                btn.classList.remove('active');
                btn.textContent = 'ENABLE';
                state.selectedPattern = null;
                state.nextPatternQueued = null;
            }
            
            renderPatternSequencer();
        }

        function init() {
            audioEngine = new DrumSynthEngine();
            
            Object.keys(state.tracks).forEach(trackId => {

                state.masterFX[key] = spec.default;
            });
            
            setupTempoKnob();
            renderTracks();
            renderSidebar();

        }

        function renderTracks() {
            const panel = document.getElementById('tracks-panel');
            const wasEmpty = panel.children.length === 0;
            
            if (wasEmpty) {
                panel.innerHTML = '';
                Object.entries(state.tracks).forEach(([trackId, track]) => {

                Object.entries(state.tracks).forEach(([trackId, track]) => {
                    const trackEl = document.querySelector(`[data-track-id="${trackId}"]`);
                    if (trackEl) {
                        trackEl.classList.toggle('selected', state.selectedTrack === trackId);
                        trackEl.classList.toggle('muted', track.mute);
                        
                        const muteBtn = trackEl.querySelector('.mute-btn');

                            muteBtn.classList.toggle('active', track.mute);
                        }
                        
                        const stepContainers = trackEl.querySelectorAll('.step-container');
                        stepContainers.forEach((container, i) => {
                            const stepEl = container.querySelector('.step');
                            const hasLocks = track.stepLocks[i] !== null;
                            
                            stepEl.classList.toggle('active', track.steps[i]);
                            stepEl.classList.toggle('playing', i === state.currentStep);
                            stepEl.classList.toggle('has-locks', hasLocks);
                            
                            const velocityBar = stepEl.querySelector('.velocity-bar');
                            const velocityValue = stepEl.querySelector('.velocity-value');
                            if (velocityBar && velocityValue) {
                                const velocity = track.velocities[i];
                                velocityBar.style.height = (velocity * 100) + '%';
                                velocityValue.textContent = Math.round(velocity * 100);
                            }
                            
                            const pBtn = container.querySelector('.p-lock-btn');
                            const sBtn = container.querySelector('.s-lock-btn');
                            
                            if (pBtn) {
                                pBtn.classList.toggle('active', hasLocks);
                            }
                            
                            if (sBtn) {

                            }
                            
                            const conditionEl = container.querySelector('.step-condition');
                            if (conditionEl) {
                                conditionEl.textContent = track.stepConditions[i];
                            }
                        });
                    }
                });
            }
        }

        function handleStepMouseDown(e, trackId, stepIndex) {
            e.preventDefault();
            e.stopPropagation();
            
            const startY = e.clientY;
            const startVelocity = state.tracks[trackId].velocities[stepIndex];
            
            dragState = {
                trackId,
                stepIndex,
                startY,
                startVelocity,
                isDragging: false,
                wasActive: state.tracks[trackId].steps[stepIndex]
            };
            
            const handleMouseMove = (moveEvent) => {
                if (!dragState) return;
                
                const deltaY = dragState.startY - moveEvent.clientY;
                const sensitivity = 0.003;
                
                if (Math.abs(deltaY) > 3) {
                    dragState.isDragging = true;
                }
                
                if (dragState.isDragging) {
                    let newVelocity = dragState.startVelocity + (deltaY * sensitivity);
                    newVelocity = Math.max(0, Math.min(1, newVelocity));
                    
                    state.tracks[trackId].velocities[stepIndex] = newVelocity;
                    
                    if (!state.tracks[trackId].steps[stepIndex]) {
                        state.tracks[trackId].steps[stepIndex] = true;
                    }
                    
                    renderTracks();
                }
            };
            
            const handleMouseUp = () => {
                if (dragState && !dragState.isDragging) {
                    toggleStep(trackId, stepIndex);
                }
                
                dragState = null;
                document.removeEventListener('mousemove', handleMouseMove);
                document.removeEventListener('mouseup', handleMouseUp);
            };
            
            document.addEventListener('mousemove', handleMouseMove);
            document.addEventListener('mouseup', handleMouseUp);
        }

                display.className = 'value-display';
                const decimals = spec.step < 0.1 ? 2 : spec.step < 1 ? 1 : 0;
                display.textContent = parseFloat(slider.value).toFixed(decimals);
                
                slider.oninput = (e) => {
                    const value = parseFloat(e.target.value);
                    display.textContent = value.toFixed(decimals);
                    updateMasterFX(key, value);
                };
                
                valueDiv.appendChild(slider);
                valueDiv.appendChild(display);
                paramDiv.appendChild(label);
                paramDiv.appendChild(valueDiv);
                container.appendChild(paramDiv);
            });
        }

        function updateMasterFX(key, value) {
            state.masterFX[key] = value;
            // Update the audio engine's master FX chain
            audioEngine.updateMasterFX(state.masterFX);
        }

        function setupEventListeners() {
            document.getElementById('play-btn').onclick = togglePlay;
            document.getElementById('reset-btn').onclick = reset;
            
            document.getElementById('randomize-pattern-btn').onclick = () => randomizePattern(state.selectedTrack);
            document.getElementById('test-sound-btn').onclick = testSound;
            document.getElementById('clear-locks-btn').onclick = clearAllLocks;
            document.getElementById('set-normal-btn').onclick = setNormalButtonClick;
            document.getElementById('recall-normal-btn').onclick = recallNormalState;
            document.getElementById('trigger-btn').onclick = triggerSound;
            
            // Pattern sequencer
            document.getElementById('pattern-seq-toggle').onclick = togglePatternSequencer;
            document.getElementById('pattern-mode').onchange = (e) => {
                state.patternSequencerMode = e.target.value;
                state.selectedPattern = null;
                state.nextPatternQueued = null;
                renderPatternSequencer();
            };
            
            // Track morph
            document.getElementById('track-generate-btn').onclick = generateTrackTarget;
            document.getElementById('track-lock-btn').onclick = lockTrackTarget;
            document.getElementById('track-morph-slider').oninput = (e) => {
                const track = state.tracks[state.selectedTrack];
                track.morphAmount = parseFloat(e.target.value);
                document.getElementById('track-morph-value').textContent = track.morphAmount.toFixed(0) + '%';
                renderParams();
                renderFX();
            };
            
            // Global morph
            document.getElementById('global-generate-btn').onclick = generateGlobalTarget;
            document.getElementById('global-lock-btn').onclick = lockGlobalTarget;
            document.getElementById('global-morph-slider').oninput = (e) => {
                state.globalMorphAmount = parseFloat(e.target.value);
                document.getElementById('global-morph-value').textContent = state.globalMorphAmount.toFixed(0) + '%';
                renderParams();
                renderFX();
            };
            
            // Modals
            document.getElementById('condition-modal').onclick = (e) => {
                if (e.target.id === 'condition-modal') {
                    closeConditionModal();
                }
            };
            
            document.getElementById('custom-steps-modal').onclick = (e) => {
                if (e.target.id === 'custom-steps-modal') {
                    closeCustomStepsModal();
                }
            };
            
            document.getElementById('custom-steps-ok').onclick = setCustomSteps;
            document.getElementById('custom-steps-cancel').onclick = closeCustomStepsModal;
            document.getElementById('custom-steps-input').onkeypress = (e) => {
                if (e.key === 'Enter') setCustomSteps();
            };
        }

        function togglePlay() {
            state.isPlaying = !state.isPlaying;
            const btn = document.getElementById('play-btn');
            
            if (state.isPlaying) {
                btn.classList.add('active');
                btn.textContent = 'STOP';
                startSequencer();
            } else {
                btn.classList.remove('active');
                btn.textContent = 'PLAY';
                stopSequencer();
                // Reset transport to beginning
                state.currentStep = -1;
                state.currentBar = 0;
                state.stepInBar = 0;
                state.patternStepCount = 0;
                updateBarIndicator();
                renderTracks();
            }
        }

        function startSequencer() {
            const stepDuration = (60 / state.tempo) * 1000 / 4;
            
            sequencerInterval = setInterval(() => {
                state.currentStep = (state.currentStep + 1) % 16;
                state.stepInBar++;
                
                if (state.stepInBar >= 16) {
                    state.stepInBar = 0;
                    state.currentBar = (state.currentBar + 1) % 4;
                    updateBarIndicator();
                }
                
                // Pattern sequencer logic
                if (state.patternSequencerEnabled) {
                    state.patternStepCount++;
                    const currentPattern = state.patterns[state.currentPattern];
                    
                    if (state.patternStepCount >= currentPattern.steps) {
                        // Pattern finished, check what to do next
                        moveToNextPattern();
                        advancePattern();
                    }
                }
                
                Object.entries(state.tracks).forEach(([trackId, track]) => {
                    const condition = track.stepConditions[state.currentStep];
                    
                    if (track.steps[state.currentStep] && !track.mute && shouldTrigger(condition, state.currentBar)) {
                        const velocity = track.velocities[state.currentStep];
                        
                        let baseEngine, baseParams, baseFX;
                        const currentLock = track.stepLocks[state.currentStep];
                        
                        if (currentLock) {
                            baseEngine = currentLock.engine;
                            baseParams = currentLock.params;
                            baseFX = currentLock.fx;
                        } else if (track.normalState) {
                            baseEngine = track.normalState.engine;
                            baseParams = track.normalState.params;
                            baseFX = track.normalState.fx;
                        } else {
                            baseEngine = track.engine;
                            baseParams = track.params;
                            baseFX = track.fx;
                        }
                        
                        const slideEnabled = track.stepSlides[state.currentStep];
                        
                        if (slideEnabled) {
                            let nextActiveStep = null;
                            let stepsToNext = 0;
                            for (let i = 1; i <= 16; i++) {
                                const nextIdx = (state.currentStep + i) % 16;
                                if (track.steps[nextIdx]) {
                                    nextActiveStep = nextIdx;
                                    stepsToNext = i;
                                    break;
                                }
                            }
                            
                            if (nextActiveStep !== null) {
                                const slideDurationSeconds = (stepsToNext * stepDuration) / 1000;
                                
                                let targetEngine, targetParams, targetFX;
                                const nextLock = track.stepLocks[nextActiveStep];
                                
                                if (nextLock) {
                                    targetEngine = nextLock.engine;
                                    targetParams = nextLock.params;
                                    targetFX = nextLock.fx;
                                } else if (track.normalState) {
                                    targetEngine = track.normalState.engine;
                                    targetParams = track.normalState.params;
                                    targetFX = track.normalState.fx;
                                } else {
                                    targetEngine = track.engine;
                                    targetParams = track.params;
                                    targetFX = track.fx;
                                }
                                
                                audioEngine.playDrumWithSlide(
                                    trackId, 
                                    baseEngine, 
                                    baseParams, 
                                    targetParams,
                                    baseFX, 
                                    targetFX,
                                    velocity,
                                    slideDurationSeconds
                                );
                            } else {
                                audioEngine.playDrum(trackId, baseEngine, baseParams, baseFX, velocity);
                            }
                        } else {
                            audioEngine.playDrum(trackId, baseEngine, baseParams, baseFX, velocity);
                        }
                    }
                });
                
                document.querySelectorAll('.step').forEach(step => {
                    step.classList.remove('playing');
                });
                document.querySelectorAll(`.step-container:nth-child(${state.currentStep + 1}) .step`).forEach(step => {
                    step.classList.add('playing');
                });
            }, stepDuration);
        }

        function stopSequencer() {
            if (sequencerInterval) {
                clearInterval(sequencerInterval);
                sequencerInterval = null;
            }
            
            Object.keys(state.tracks).forEach(trackId => {
                audioEngine.stopVoice(trackId);
            });
            
            document.querySelectorAll('.step').forEach(step => {
                step.classList.remove('playing');
            });
        }

        function updateBarIndicator() {
            document.getElementById('bar-indicator').textContent = `Bar: ${state.currentBar + 1}/4`;
        }

        function reset() {
            const wasPlaying = state.isPlaying;
            
            if (wasPlaying) {
                stopSequencer();
            }
            
            state.currentStep = -1;
            state.currentBar = 0;
            state.stepInBar = 0;
            state.patternStepCount = 0;
            updateBarIndicator();
            renderTracks();
            
            if (wasPlaying) {
                startSequencer();
            }
        }

        function selectTrack(trackId) {
            state.selectedTrack = trackId;
            renderTracks();
            renderSidebar();
        }

        function toggleStep(trackId, stepIndex) {
            state.tracks[trackId].steps[stepIndex] = !state.tracks[trackId].steps[stepIndex];
            renderTracks();
        }

        function togglePLock(trackId, stepIndex) {
            const track = state.tracks[trackId];
            
            if (track.stepLocks[stepIndex]) {
                track.stepLocks[stepIndex] = null;
            } else {
                track.stepLocks[stepIndex] = {
                    engine: track.engine,
                    params: { ...track.params },
                    fx: { ...track.fx }
                };
            }
            
            renderTracks();
        }

        function toggleSLock(trackId, stepIndex) {
            const track = state.tracks[trackId];
            track.stepSlides[stepIndex] = !track.stepSlides[stepIndex];
            renderTracks();
        }

        function toggleMute(trackId) {
            state.tracks[trackId].mute = !state.tracks[trackId].mute;
            renderTracks();
        }

        function randomizePattern(trackId) {
            const density = 0.25 + Math.random() * 0.3;
            state.tracks[trackId].steps = Array(16).fill(false).map(() => Math.random() < density);
            state.tracks[trackId].velocities = Array(16).fill(0).map(() => 0.4 + Math.random() * 0.6);
            renderTracks();
        }

        function clearPattern(trackId) {
            state.tracks[trackId].steps = Array(16).fill(false);
            renderTracks();
        }

        function changeEngine(engineId) {
            const track = state.tracks[state.selectedTrack];
            track.engine = engineId;
            
            const engineSpec = ENGINE_SPECS[engineId];
            const newParams = {};
            Object.entries(engineSpec.params).forEach(([key, spec]) => {
                newParams[key] = spec.default;
            });
            track.params = newParams;
            
            const newFX = {};
            Object.entries(FX_SPECS).forEach(([key, spec]) => {
                newFX[key] = spec.default;
            });
            track.fx = newFX;
            
            setNormalState(state.selectedTrack);
            
            const btn = document.getElementById('set-normal-btn');
            if (btn) {
                const originalText = btn.textContent;
                btn.textContent = 'AUTO SAVED';
                btn.classList.add('active');
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('active');
                }, 500);
            }
            
            renderTracks();
            renderSidebar();
        }

        function updateParam(key, value) {
            const track = state.tracks[state.selectedTrack];
            track.params[key] = value;
            
            if (track.morphAmount > 0) {
                track.morphAmount = 0;
                track.targetParams = null;
                document.getElementById('track-morph-slider').value = 0;
                document.getElementById('track-morph-value').textContent = '0%';
            }
        }

        function updateFX(key, value) {
            const track = state.tracks[state.selectedTrack];
            track.fx[key] = value;
            
            if (track.morphAmount > 0) {
                track.morphAmount = 0;
                track.targetParams = null;
                document.getElementById('track-morph-slider').value = 0;
                document.getElementById('track-morph-value').textContent = '0%';
            }
        }

        function clearAllLocks() {
            const track = state.tracks[state.selectedTrack];
            track.stepLocks = Array(16).fill(null);
            renderTracks();
        }

        function generateGlobalTarget() {
            Object.keys(state.tracks).forEach(trackId => {
                const track = state.tracks[trackId];
                track.targetParams = {
                    engine: track.engine,
                    params: generateRandomParams(track.engine),
                    fx: generateRandomFX()
                };
            });
        }

        function lockGlobalTarget() {
            Object.keys(state.tracks).forEach(trackId => {
                const track = state.tracks[trackId];
                if (track.targetParams) {
                    const morphed = getMorphedState(track);
                    track.params = { ...morphed.params };
                    track.fx = { ...morphed.fx };
                    track.targetParams = null;
                }
            });
            
            state.globalMorphAmount = 0;
            document.getElementById('global-morph-slider').value = 0;
            document.getElementById('global-morph-value').textContent = '0%';
            
            renderParams();
            renderFX();
        }

        function generateTrackTarget() {
            const track = state.tracks[state.selectedTrack];
            track.targetParams = {
                engine: track.engine,
                params: generateRandomParams(track.engine),
                fx: generateRandomFX()
            };
            
            const btn = document.getElementById('track-generate-btn');
            const originalText = btn.textContent;
            btn.textContent = 'GENERATED!';
            setTimeout(() => {
                btn.textContent = originalText;
            }, 300);
        }

        function lockTrackTarget() {
            const track = state.tracks[state.selectedTrack];
            if (track.targetParams) {
                const morphed = getMorphedState(track);
                track.params = { ...morphed.params };
                track.fx = { ...morphed.fx };
                track.targetParams = null;
            }
            
            track.morphAmount = 0;
            document.getElementById('track-morph-slider').value = 0;
            document.getElementById('track-morph-value').textContent = '0%';
            
            const btn = document.getElementById('track-lock-btn');
            const originalText = btn.textContent;
            btn.textContent = 'LOCKED!';
            setTimeout(() => {
                btn.textContent = originalText;
            }, 300);
            
            renderParams();
            renderFX();
        }

        function openConditionModal(trackId, stepIndex) {
            state.conditionModalTrack = trackId;
            state.conditionModalStep = stepIndex;
            
            const grid = document.getElementById('condition-grid');
            grid.innerHTML = '';
            
            const conditions = [
                '1:1',
                '1:2', '2:2',
                '1:3', '2:3', '3:3',
                '1:4', '2:4', '3:4', '4:4'
            ];
            
            conditions.forEach(condition => {
                const option = document.createElement('div');
                option.className = 'condition-option';
                option.textContent = condition;
                option.onclick = () => setCondition(condition);
                grid.appendChild(option);
            });
            
            document.getElementById('condition-modal').classList.add('active');
        }

        function closeConditionModal() {
            document.getElementById('condition-modal').classList.remove('active');
            state.conditionModalTrack = null;
            state.conditionModalStep = null;
        }

        function setCondition(condition) {
            if (state.conditionModalTrack && state.conditionModalStep !== null) {
                state.tracks[state.conditionModalTrack].stepConditions[state.conditionModalStep] = condition;
                renderTracks();
            }
            closeConditionModal();
        }

        function testSound() {
            const track = state.tracks[state.selectedTrack];
            const morphedState = getMorphedState(track);
            audioEngine.playDrum(null, morphedState.engine, morphedState.params, morphedState.fx, 0.8);
        }

        function triggerSound() {
            const track = state.tracks[state.selectedTrack];
            const morphedState = getMorphedState(track);
            audioEngine.playDrum(null, morphedState.engine, morphedState.params, morphedState.fx, 0.8);
            
            const btn = document.getElementById('trigger-btn');
            btn.classList.add('active');
            setTimeout(() => btn.classList.remove('active'), 100);
        }

        window.onload = init;
    </script>
</body>
</html>
